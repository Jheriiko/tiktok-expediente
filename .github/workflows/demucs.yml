name: Separar Audio con Demucs

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'URL directa del archivo MP3'
        required: true

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar FFmpeg y Demucs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U demucs

      - name: Descargar el Audio
        run: |
          curl -L -o audio_original.mp3 "${{ github.event.inputs.audio_url }}"

      - name: Ejecutar Demucs
        run: |
          demucs --mp3 audio_original.mp3

      - name: Guardar las pistas separadas
        uses: actions/upload-artifact@v3
        with:
          name: pistas-separadas
          path: separated/htdemucs/audio_original/
