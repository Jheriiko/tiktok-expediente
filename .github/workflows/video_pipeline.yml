name: Fábrica de Videos Daniel Plomero (Agnes AI)
on: workflow_dispatch
jobs:
  generar-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Instalar Dependencias
        run: pip install requests
      - name: Ejecutar Agnes AI
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
        run: python generate_video.py
      - name: Guardar Video
        uses: actions/upload-artifact@v4
        with:
          name: video-daniel-plomero
          path: video_daniel_plomero.mp4
          if-no-files-found: error # 🚨 OBLIGA A FALLAR SI NO HAY VIDEO
