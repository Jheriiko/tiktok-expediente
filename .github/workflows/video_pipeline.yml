name: Fábrica de Videos Daniel Plomero

on:
  workflow_dispatch: # Botón manual para ejecutar

jobs:
  generar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependencias (FFmpeg, Edge-TTS, Requests)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests edge-tts

      - name: Ejecutar Fábrica de Videos
        env:
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
        run: python generate_plomero_video.py

      - name: Guardar Video Final
        uses: actions/upload-artifact@v4
        with:
          name: video-daniel-plomero
          path: video_daniel_plomero_final.mp4
          retention-days: 7
