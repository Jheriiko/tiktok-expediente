name: Separar Audio Automático

on:
  workflow_dispatch:
  push:
    paths:
      - '*.mp3'
      - '*.wav'

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Demucs
        run: |
          python -m pip install --upgrade pip
          pip install -U demucs torch torchaudio

      - name: Separar la canción
        run: |
          # Busca automáticamente el primer archivo mp3 o wav en la raíz
          FILE=$(find . -maxdepth 1 -type f \( -iname "*.mp3" -o -iname "*.wav" \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "❌ Error: No se encontró ningún archivo .mp3 o .wav en la raíz del repositorio."
            exit 1
          fi
          echo "🎵 Procesando: $FILE"
          # Usa --segment 10 y -d cpu para evitar el error de falta de memoria (Exit code 1)
          demucs --two-stems=vocals --segment 10 -d cpu -o output "$FILE"

      - name: Comprimir resultados
        run: zip -r resultado.zip output/

      - name: Guardar ZIP para descargar
        uses: actions/upload-artifact@v4
        with:
          name: pistas-separadas
          path: resultado.zip
