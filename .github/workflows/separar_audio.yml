name: Separar Audio Automático

on:
  workflow_dispatch:
  push:
    paths:
      - '*.mp3'
      - '*.wav'

jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cachear paquetes de Python (pip)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar Ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Instalar Demucs y NumPy
        run: |
          python -m pip install --upgrade pip
          pip install -U demucs torch torchaudio "numpy<2.0" ffmpeg-python

      - name: Cachear modelos de Demucs
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: ${{ runner.os }}-demucs-models-v1
          restore-keys: |
            ${{ runner.os }}-demucs-models-

      - name: Separar la canción
        run: |
          FILE=$(find . -maxdepth 1 -type f \( -iname "*.mp3" -o -iname "*.wav" \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "❌ Error: No se encontró archivo. Archivos actuales:"
            ls -la
            exit 1
          fi
          echo "🎵 Procesando: $FILE"
          demucs --two-stems=vocals --segment 7 -d cpu -o output "$FILE"

      - name: Comprimir resultados
        run: zip -r resultado.zip output/

      - name: Guardar ZIP para descargar
        uses: actions/upload-artifact@v4
        with:
          name: pistas-separadas
          path: resultado.zip
