name: Separar Audio
on: workflow_dispatch
jobs:
  separar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Instalar Demucs
        run: pip install -U demucs
      - name: Separar en 4 pistas
        run: demucs -n htdemucs --mp3 --segment 7 -d cpu -o output cancion.mp3
      - name: Comprimir
        run: zip -r resultado.zip output/
      - uses: actions/upload-artifact@v4
        with:
          name: pistas-separadas
          path: resultado.zip
